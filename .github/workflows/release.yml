# Publishes @openma/deepseek-harness-sdk to npm when a v* tag is pushed,
# using npm Trusted Publishing (OIDC) — no npm token stored anywhere.
#
# One-time setup (the package must exist on npm before a trusted publisher
# can be configured):
#   1. Bootstrap release from a maintainer machine:
#        npm login && npm publish --no-provenance
#      (provenance is CI-only, hence --no-provenance for this one publish)
#   2. On npmjs.com -> package -> Settings -> Trusted publisher:
#        GitHub Actions / org `openma-ai` /
#        repository `deepseek-harness-typescript-sdk` /
#        workflow filename `release.yml` (environment: leave empty)
#   3. Every later release is tokenless: `npm version patch && git push --follow-tags`
#
# Requirements bound by npm: GitHub-hosted runner, `id-token: write`,
# npm CLI >= 11.5.1 (hence the npm upgrade step below).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Ensure tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi
      # prepublishOnly runs the build; publishConfig owns access + provenance.
      # Auth comes from the OIDC exchange — no NODE_AUTH_TOKEN.
      - run: npm publish
